apiVersion: apps/v1
kind: Deployment
metadata:
    name: go-app-deployment
    labels:
        app: go-app
spec:
    replicas: 2
    selector:
        matchLabels:
            app: go-app
    template:
        metadata:
            labels:
                app: go-app
        spec:
            containers:
                name: go-app
                image: go-k8s-app:v1
                imagePullPolicy: IfNotPresent
                ports:
                    containerPort: 8080